services:
  - type: web
    name: flashlearn-hk
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma db push && npm run seed && npm run start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        sync: false
      - key: DATABASE_URL
        sync: false
